<layout title="Voitures" active="home">
  <div class="page-header">
    <h1>Flotte de véhicules</h1>
    <details class="home-search">
      <summary aria-label="Afficher la recherche">⌕ Recherche</summary>
      <search-bar q="">
    </details>
  </div>

  <alert kind="error" message="${home.error_text}">
  <alert kind="success" message="${home.success_text}">

  <div class="stats-row">
    <stat-badge label="Voitures" value="${home.car_count}">
    <stat-badge label="Valeur d'achat totale" value="${home.purchase_price}">
    <stat-badge label="Valeur estimée totale" value="${home.estimated_price}">
    <stat-badge label="Plus-value entretiens" value="${home.profit}">
  </div>

  <section class="card">
    <h2>Ajouter une voiture</h2>
    <form method="POST" action="/voitures/ajouter" class="form-grid">
      <label>Référence
        <input type="text" name="reference" placeholder="AB-123-CD" required>
      </label>
      <label>Marque
        <input type="text" name="brand" placeholder="Peugeot" required>
      </label>
      <label>Modèle
        <input type="text" name="model" placeholder="308" required>
      </label>
      <label>Prix d'achat (€)
        <input type="number" step="0.01" min="0" name="purchase_price" placeholder="8500" required>
      </label>
      <label>Date d'acquisition
        <input type="date" name="acquisition_date">
      </label>
      <label>Date de cession
        <input type="date" name="sale_date">
      </label>
      <button type="submit">Ajouter la voiture</button>
    </form>
  </section>

  <section>
    <h2>Toutes les voitures</h2>
    <div class="cars-grid">${home.cars_html}</div>
  </section>
</layout>
