[package]
name    = "ocara_runtime_android_jni"
version = "1.0.0"
edition = "2024"

[lib]
name       = "ocara_runtime_android_jni"
crate-type = ["staticlib"]

[dependencies]
# `jni` (wrapper sûr), pas `jni-sys` brut : premier essai avec `jni-sys` seul
# (accès à la main à la table de fonctions JNI, GetStringUTFChars via l'union
# versionnée `v1_1` générée par jni-sys-macros) — SIGSEGV reproductible sur un
# vrai appareil (offset de champ probablement mal calculé, jamais élucidé
# précisément). Remplacé par `jni`, dont la conversion `JString` → `String`
# est testée par un écosystème entier plutôt que par un accès de structure
# fait à la main ici. Le coût (dépendances `combine`/`cesu8` en plus) est
# largement justifié : la correction prime sur la taille du binaire pour du
# code qui plante sinon silencieusement sur certains appareils seulement.
jni = "0.21"
# `libc::chdir` — voir la doc de `Java_..._nativeStartServer` dans src/lib.rs.
libc = "0.2"
