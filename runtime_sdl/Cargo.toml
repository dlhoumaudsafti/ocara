[package]
name    = "ocara_runtime_sdl"
version = "1.0.0"
edition = "2024"

[lib]
name       = "ocara_runtime_sdl"
crate-type = ["staticlib"]

[dependencies]
# Crate séparé du runtime principal (ocara_runtime) : même raison que
# runtime_tauri (voir la doc en tête de src/codegen/link.rs) — SDL3 n'est lié
# dans le binaire final que pour les programmes qui importent réellement
# ocara.SDL. Isoler ça dans un .a distinct est ce qui rend ça possible : sans
# cette séparation, le partitionnement en unités de codegen de rustc mélange
# du code SDL avec du code toujours nécessaire, et aucun flag de linker ne
# peut alors éviter d'exiger SDL3 installé sur la machine cible.
ocara_runtime = { path = "../runtime" }
# build-from-source-static : SDL3 compilé depuis les sources (cmake + un
# compilateur C, voir README) et lié STATIQUEMENT — aucun libSDL3.so requis sur
# la machine cible, même esprit que rusqlite "bundled" / OpenSSL "vendored"
# ailleurs dans ce projet. Nécessaire ici de toute façon : libsdl3-dev n'est pas
# encore packagé sur les distributions courantes (SDL3 est récent).
# image/ttf : Palier 2 (textures + texte), features de sdl3 elle-même — pas de
# crate séparée (`sdl3-image`/`sdl3-ttf` n'existent pas en haut niveau, seuls
# les `-sys` bas niveau existent, déjà tirés en transitif par ces features).
# unsafe_textures : fait de `Texture` un newtype sans lifetime (au lieu de
# `Texture<'r>` liée à son `TextureCreator`) — seul moyen propre de stocker des
# textures à côté du `Canvas` dans la même struct sans hack (Box::leak/transmute).
# Voir runtime_sdl/src/lib.rs pour la contrepartie (destroy() manuel requis
# pour les textures éphémères de drawText, jamais pour celles de loadTexture).
# mixer : Palier 3 (audio), feature de sdl3 elle-même (comme image/ttf) — pas
# de crate séparée. `build-from-source-static` a déjà une arête faible vers
# `sdl3-mixer-sys?/build-static-vendored` : elle s'active automatiquement dès
# que "mixer" est présent, aucune feature de build supplémentaire à ajouter.
sdl3 = { version = "0.18", default-features = false, features = [
    "build-from-source-static",
    "image",
    "ttf",
    "mixer",
    "unsafe_textures",
] }
once_cell = "1.20"
# Unifie une feature sur la dépendance TRANSITIVE sdl3-mixer-sys (activée par
# la feature "mixer" de `sdl3` ci-dessus, jamais listée directement autrement) :
# désactive entièrement libxmp (codec MOD/tracker vendored de SDL_mixer —
# formats de musique "tracker" Amiga/DOS, WAV/OGG/MP3/FLAC/Opus restent
# disponibles). Découvert en cross-compilant pour Android
# (docs/roadmap.d/packaging-android.md, sous-chantier 4), en DEUX temps :
# 1. La variante partagée par défaut de libxmp (`SDLMIXER_MOD_XMP_SHARED`, ON
#    sauf indication contraire) échoue à l'édition de liens avec `ld.lld`
#    (linker du NDK, plus strict que le `ld` GNU habituel sur les scripts de
#    version) : le script de version référence `xmp_set_player`/
#    `xmp_get_player`, absents du binaire réellement compilé pour cette
#    cible précise.
# 2. Forcer la variante statique (`no-sdlmixer-mod-xmp-shared`) contourne ce
#    premier problème mais en révèle un second : le `.pc` généré par CMake
#    pour la configuration statique contient une expression génératrice CMake
#    non résolue (`$<TARGET_FILE_BASE_NAME:...>`), que `rpkg-config`
#    (utilisé par le build.rs de sdl3-mixer-sys) prend alors littéralement
#    pour un nom de bibliothèque à lier — erreur de compilation Rust
#    (`renaming of the library ... however this crate contains no
#    #[link(...)] attributes`).
# Plutôt que de continuer à contourner des bugs amont de CMake/rpkg-config
# pour un codec de niche, désactivé entièrement pour Android via
# `no-sdlmixer-mod-xmp`. Aucun impact sur la compilation hôte (le contenu de
# cette feature n'est PAS conditionné à la cible — MOD/XMP désactivé aussi sur
# desktop ; à revoir si le support MOD s'avère un jour nécessaire là).
sdl3-mixer-sys = { version = "0.6", features = ["no-sdlmixer-mod-xmp"] }
